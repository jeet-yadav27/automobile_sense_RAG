
name: Automotive RAG - Azure CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: automotive-rag-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-automobile-rag-dev
  ACR_NAME: automobileragacr2026
  ACR_LOGIN_SERVER: automobileragacr2026.azurecr.io
  BACKEND_APP: warranty-rag-backend
  FRONTEND_APP: warranty-rag-frontend
  FRONTEND_URL: https://warranty-rag-frontend.bravecoast-33edf5ab.centralindia.azurecontainerapps.io

jobs:
  validate:
    name: Validate and security scan
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # 1. Checkout repository
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # 2. Python setup
      # ---------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ---------------------------------------
      # 3. Validate Python syntax
      # ---------------------------------------
      - name: Validate Python syntax
        run: |
          python -m compileall -q api services db

      # ---------------------------------------
      # 4. Install backend dependencies
      # ---------------------------------------
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt
          python -m pip install pytest

      # ---------------------------------------
      # 5. Run backend tests
      # ---------------------------------------
      - name: Run backend automated tests
        env:
          DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test_db"
          OPENAI_API_KEY: "ci-test-placeholder-not-a-real-key"
          APPLICATIONINSIGHTS_CONNECTION_STRING: ""
          LANGCHAIN_TRACING_V2: "false"
        run: |
          python -m pytest \
            tests/test_health.py \
            tests/test_security.py \
            -v

      # ---------------------------------------
      # 6. Install Python security scanner
      # ---------------------------------------
      - name: Install Python security scanner
        run: |
          python -m pip install pip-audit

      # ---------------------------------------
      # 7. Python dependency vulnerability scan
      # ---------------------------------------
      - name: Scan Python dependencies
        run: |
          python -m pip_audit \
            --format json \
            --output python-audit.json

      # ---------------------------------------
      # 8. Upload Python security report
      # ---------------------------------------
      - name: Upload Python security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-report
          path: python-audit.json
          if-no-files-found: ignore

      # ---------------------------------------
      # 9. Node.js setup
      # ---------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---------------------------------------
      # 10. Install frontend dependencies
      # ---------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ---------------------------------------
      # 11. Frontend vulnerability scan
      # ---------------------------------------
      - name: Scan frontend production dependencies
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=high

      - name: Scan frontend build dependencies
        working-directory: frontend
        continue-on-error: true
        run: |
          npm audit --audit-level=high --json > npm-audit.json


      - name: Upload frontend security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-report
          path: frontend/npm-audit.json
          if-no-files-found: ignore


      # ---------------------------------------
      # 13. Frontend lint
      # ---------------------------------------
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      # ---------------------------------------
      # 14. Frontend production build
      # ---------------------------------------
      - name: Frontend production build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Build and deploy to Azure
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ---------------------------------------
      # 15. Checkout repository
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # 16. Azure authentication using OIDC
      # ---------------------------------------
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ---------------------------------------
      # 17. Login to Azure Container Registry
      # ---------------------------------------
      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      # ---------------------------------------
      # 18. Build backend Docker image
      # ---------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -f Dockerfile.api \
            -t "$ACR_LOGIN_SERVER/warranty-rag-backend:${GITHUB_SHA}" \
            .

      # ---------------------------------------
      # 19. Build frontend Docker image
      # ---------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t "$ACR_LOGIN_SERVER/warranty-rag-frontend:${GITHUB_SHA}" \
            frontend



      - name: Scan backend Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/warranty-rag-backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/warranty-rag-frontend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'


      # ---------------------------------------
      # 20. Push backend image to ACR
      # ---------------------------------------
      - name: Push backend image
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/warranty-rag-backend:${GITHUB_SHA}"

      # ---------------------------------------
      # 21. Push frontend image to ACR
      # ---------------------------------------
      - name: Push frontend image
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/warranty-rag-frontend:${GITHUB_SHA}"


      # ---------------------------------------
      # 22. Save healthy revisions for rollback
      # ---------------------------------------
      - name: Save healthy revisions
        id: rollback_targets
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_PREVIOUS=$(az containerapp show \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.traffic[?weight==`100`].revisionName | [0]' \
            --output tsv)

          FRONTEND_PREVIOUS=$(az containerapp show \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.traffic[?weight==`100`].revisionName | [0]' \
            --output tsv)

          if [ -z "$BACKEND_PREVIOUS" ] || [ "$BACKEND_PREVIOUS" = "None" ] || \
             [ -z "$FRONTEND_PREVIOUS" ] || [ "$FRONTEND_PREVIOUS" = "None" ]; then
            echo "Could not identify revisions receiving 100% traffic."
            exit 1
          fi

          echo "Previous backend: $BACKEND_PREVIOUS"
          echo "Previous frontend: $FRONTEND_PREVIOUS"

          echo "backend_previous=$BACKEND_PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "frontend_previous=$FRONTEND_PREVIOUS" >> "$GITHUB_OUTPUT"


      # ---------------------------------------
      # 22. Deploy backend Container App
      # ---------------------------------------
      - name: Deploy backend
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$ACR_LOGIN_SERVER/warranty-rag-backend:${GITHUB_SHA}"

          for attempt in 1 2 3; do
            echo "Backend deployment attempt $attempt"

            if az containerapp update \
              --name "$BACKEND_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE"; then

              echo "Backend deployment command succeeded."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Backend deployment failed after 3 attempts."
              exit 1
            fi

            echo "Waiting 30 seconds before retry..."
            sleep 30
          done

      # ---------------------------------------
      # 23. Deploy frontend Container App
      # ---------------------------------------
      - name: Deploy frontend
        run: |
          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/warranty-rag-frontend:${GITHUB_SHA}"


      # ---------------------------------------
      # Capture newly deployed revisions
      # ---------------------------------------
      - name: Capture new revisions
        id: new_revisions
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_NEW=$(az containerapp show \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.latestRevisionName" \
            --output tsv)

          FRONTEND_NEW=$(az containerapp show \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.latestRevisionName" \
            --output tsv)

          echo "New backend revision: $BACKEND_NEW"
          echo "New frontend revision: $FRONTEND_NEW"

          if [ -z "$BACKEND_NEW" ] || [ -z "$FRONTEND_NEW" ]; then
            echo "Failed to capture new revisions"
            exit 1
          fi

          if [ "$BACKEND_NEW" = "${{ steps.rollback_targets.outputs.backend_previous }}" ] || \
             [ "$FRONTEND_NEW" = "${{ steps.rollback_targets.outputs.frontend_previous }}" ]; then
            echo "Expected new revisions were not created"
            exit 1
          fi

          echo "backend_new=$BACKEND_NEW" >> "$GITHUB_OUTPUT"
          echo "frontend_new=$FRONTEND_NEW" >> "$GITHUB_OUTPUT"


      # ---------------------------------------
      # Validate new Azure Container App revisions
      # ---------------------------------------
      - name: Validate new revisions
        shell: bash
        env:
          BACKEND_NEW: ${{ steps.new_revisions.outputs.backend_new }}
          FRONTEND_NEW: ${{ steps.new_revisions.outputs.frontend_new }}
        run: |
          set -euo pipefail

          for APP in "$BACKEND_APP" "$FRONTEND_APP"; do
            if [ "$APP" = "$BACKEND_APP" ]; then
              REVISION="$BACKEND_NEW"
            else
              REVISION="$FRONTEND_NEW"
            fi

            echo "Checking $APP revision: $REVISION"

            HEALTHY=false

            for attempt in $(seq 1 30); do
              STATUS=$(az containerapp revision show \
                --name "$APP" \
                --resource-group "$RESOURCE_GROUP" \
                --revision "$REVISION" \
                --query "properties.healthState" \
                --output tsv)

              echo "Attempt $attempt: $STATUS"

              if [ "$STATUS" = "Healthy" ]; then
                HEALTHY=true
                break
              fi

              sleep 10
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Revision failed health validation: $REVISION"
              exit 1
            fi
          done

          echo "Both new revisions passed Azure health validation"


      # ---------------------------------------
      # Verify production traffic remains pinned
      # ---------------------------------------
      - name: Verify production traffic is pinned
        shell: bash
        env:
          BACKEND_PREVIOUS: ${{ steps.rollback_targets.outputs.backend_previous }}
          FRONTEND_PREVIOUS: ${{ steps.rollback_targets.outputs.frontend_previous }}
        run: |
          set -euo pipefail

          for APP in "$BACKEND_APP" "$FRONTEND_APP"; do
            if [ "$APP" = "$BACKEND_APP" ]; then
              EXPECTED="$BACKEND_PREVIOUS"
            else
              EXPECTED="$FRONTEND_PREVIOUS"
            fi

            echo "Checking traffic for $APP"

            TRAFFIC=$(az containerapp show \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.traffic" \
              --output json)

            echo "$TRAFFIC"

            echo "$TRAFFIC" | jq -e --arg expected "$EXPECTED" '
              length > 0 and
              all(.[];
                .revisionName == $expected and
                .weight == 100 and
                (.latestRevision != true)
              )
            ' > /dev/null || {
              echo "Unexpected production traffic configuration for $APP"
              exit 1
            }
          done

          echo "Production traffic is safely pinned"




      # ---------------------------------------

      # ---------------------------------------
      # Pre-promotion backend health check
      # ---------------------------------------
      - name: Check new backend before promotion
        shell: bash
        env:
          BACKEND_NEW: ${{ steps.new_revisions.outputs.backend_new }}
        run: |
          set -euo pipefail

          JOB_NAME="rag-backend-healthcheck"
          API_VERSION="2024-03-01"

          FQDN=$(az containerapp revision show \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$BACKEND_NEW" \
            --query "properties.fqdn" \
            --output tsv)

          if [ -z "$FQDN" ] || [ "$FQDN" = "None" ]; then
            echo "Backend revision FQDN not found"
            exit 1
          fi

          TARGET_URL="http://${FQDN}/api/v1/health"
          echo "Testing backend revision: $BACKEND_NEW"

          JOB_ID=$(az containerapp job show \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id --output tsv)

          az rest \
            --method GET \
            --url "https://management.azure.com${JOB_ID}?api-version=${API_VERSION}" \
            --output json > healthcheck-job.json

          python3 - "$TARGET_URL" <<'PY'
          import json
          import sys

          target_url = sys.argv[1]

          with open("healthcheck-job.json", encoding="utf-8") as f:
              job = json.load(f)

          container = job["properties"]["template"]["containers"][0]
          container["command"] = ["curl"]
          container["args"] = [
              "--fail",
              "--silent",
              "--show-error",
              "--max-time",
              "15",
              target_url
          ]
          container.pop("env", None)

          with open("healthcheck-updated.json", "w") as f:
              json.dump(job, f)
          PY

          az rest \
            --method PUT \
            --url "https://management.azure.com${JOB_ID}?api-version=${API_VERSION}" \
            --headers "Content-Type=application/json" \
            --body "@healthcheck-updated.json" \
            --output none



          # Verify Azure saved the intended health-check target
          SAVED_URL=$(az containerapp job show \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].args[-1]" \
            --output tsv)

          echo "Expected target: $TARGET_URL"
          echo "Saved target: $SAVED_URL"

          if [ "$SAVED_URL" != "$TARGET_URL" ]; then
            echo "ERROR: Health-check job target mismatch"
            exit 1
          fi

          echo "Health-check job configuration verified"


          EXECUTION=$(az containerapp job start \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query name --output tsv)

          if [ -z "$EXECUTION" ]; then
            echo "Health-check job did not start"
            exit 1
          fi

          echo "Execution: $EXECUTION"


          # Verify the actual execution targets the new revision
          EXECUTION_URL=$(az containerapp job execution show \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --job-execution-name "$EXECUTION" \
            --query "properties.template.containers[0].args[-1]" \
            --output tsv)

          echo "Execution target: $EXECUTION_URL"

          if [ "$EXECUTION_URL" != "$TARGET_URL" ]; then
            echo "ERROR: Execution targets the wrong backend revision"
            exit 1
          fi

          echo "Execution target verified"


          for attempt in $(seq 1 30); do
            STATUS=$(az containerapp job execution show \
              --name "$JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION" \
              --query "properties.status" \
              --output tsv)

            echo "Attempt $attempt: $STATUS"

            if [ "$STATUS" = "Succeeded" ]; then
              echo "Backend health check passed"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ]; then
              echo "Backend health check failed"
              exit 1
            fi

            sleep 10
          done

          echo "Backend health check timed out"
          exit 1




      # ---------------------------------------
      # Promote validated revisions
      # ---------------------------------------
      # ---------------------------------------
      # TEMPORARY: Controlled rollback test
      # ---------------------------------------
      - name: Simulate deployment failure for rollback test
        shell: bash
        run: |
          echo "ROLLBACK TEST: Simulating a failure before production promotion"
          exit 1
      - name: Promote new revisions
        shell: bash
        env:
          BACKEND_NEW: ${{ steps.new_revisions.outputs.backend_new }}
          FRONTEND_NEW: ${{ steps.new_revisions.outputs.frontend_new }}
        run: |
          set -euo pipefail

          echo "Promoting backend revision: $BACKEND_NEW"

          az containerapp ingress traffic set \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight "$BACKEND_NEW=100"

          echo "Promoting frontend revision: $FRONTEND_NEW"

          az containerapp ingress traffic set \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight "$FRONTEND_NEW=100"

          echo "Traffic promotion commands completed."

      # ---------------------------------------
      # 24. Verify backend health
      # ---------------------------------------
      - name: Verify backend health
        run: |
          for attempt in $(seq 1 20); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              "$FRONTEND_URL/api/v1/health" || true)

            if [ "$status" = "200" ]; then
              echo "Backend health check passed"
              exit 0
            fi

            echo "Attempt $attempt: HTTP $status"
            sleep 10
          done

          echo "Backend health check failed"
          exit 1

      # ---------------------------------------
      # 25. Show deployed revisions
      # ---------------------------------------
      - name: Show deployed revisions
        if: success()
        run: |
          az containerapp revision list \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --output table

          az containerapp revision list \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --output table



      # ---------------------------------------
      # Automatic rollback on deployment failure
      # ---------------------------------------
      - name: Rollback on deployment failure
        if: ${{ failure() && steps.rollback_targets.outcome == 'success' }}
        shell: bash
        env:
          BACKEND_PREVIOUS: ${{ steps.rollback_targets.outputs.backend_previous }}
          FRONTEND_PREVIOUS: ${{ steps.rollback_targets.outputs.frontend_previous }}
        run: |
          set -euo pipefail

          echo "Deployment failed. Restoring previous revisions."

          # Activate old revisions only when inactive
          for APP in "$BACKEND_APP" "$FRONTEND_APP"; do
            if [ "$APP" = "$BACKEND_APP" ]; then
              REVISION="$BACKEND_PREVIOUS"
            else
              REVISION="$FRONTEND_PREVIOUS"
            fi

            ACTIVE=$(az containerapp revision show \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION" \
              --query "properties.active" \
              --output tsv)

            if [ "${ACTIVE,,}" = "true" ]; then
              echo "$REVISION already active. Skipping."
            else
              echo "Activating $REVISION"
              az containerapp revision activate \
                --name "$APP" \
                --resource-group "$RESOURCE_GROUP" \
                --revision "$REVISION"
            fi
          done

          # Restore previous revision traffic
          az containerapp ingress traffic set \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight "$BACKEND_PREVIOUS=100"

          az containerapp ingress traffic set \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight "$FRONTEND_PREVIOUS=100"

          echo "Previous revision traffic restored."

          # Verify rollback traffic allocation
          for APP in "$BACKEND_APP" "$FRONTEND_APP"; do
            if [ "$APP" = "$BACKEND_APP" ]; then
              REVISION="$BACKEND_PREVIOUS"
            else
              REVISION="$FRONTEND_PREVIOUS"
            fi

            WEIGHT=$(az containerapp show \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.traffic[?revisionName=='${REVISION}'].weight | [0]" \
              --output tsv)

            if [ "$WEIGHT" != "100" ]; then
              echo "Rollback verification failed for $APP. Weight: $WEIGHT"
              exit 1
            fi

            echo "$APP rollback verified: $REVISION = 100%"
          done

          echo "Automatic rollback verification completed."
